name: Update Cubing Wrapped

on:
  schedule:
    - cron: '12 2 * * *'        # every day, after the WCA publishes its export (~00:30 UTC)
  workflow_dispatch:            # lets you press "Run workflow" by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download WCA export
        run: curl -sSL --fail --retry 3 -o "$RUNNER_TEMP/export.zip" https://www.worldcubeassociation.org/export/results/v2/tsv

      - name: Build site
        run: |
          mkdir -p site
          python3 build_wrapped.py "$RUNNER_TEMP/export.zip" site
          cp index.html site/index.html
          cp wrapped-preview.png site/wrapped-preview.png || echo "no preview image found, skipping"

      - name: Check the site folder
        run: |
          ls site | head
          python3 -c "import json; d=json.load(open('site/meta.json')); assert d['years'][0]==1982 and d['years'][-1]==d['cur'] and len(d['years'])>=20; assert len(d['events'])==17; assert d['top'][str(d['cur'])]['comps']"
          test -s site/index.html
          test "$(find site/y -name '*.gz' | wc -l)" -gt 300
          test "$(ls site/i | wc -l)" -gt 200

      - name: Keep the schedule alive
        run: |
          # GitHub switches off scheduled runs after 60 days without any commit, so make a tiny one monthly
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 2592000 ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            date -u +%F > .keepalive
            git add .keepalive
            git commit -m "Keep scheduled runs alive"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Wait for the upload to register
        run: sleep 15

      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
